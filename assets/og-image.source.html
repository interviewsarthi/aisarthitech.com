<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<style>
@font-face{font-family:'DM Sans';font-weight:400 700;src:url(fonts/dm-sans-latin.woff2) format('woff2')}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:'DM Sans',sans-serif;color:#142b43;background:
 radial-gradient(700px 380px at 95% -5%,rgba(59,63,196,.16),transparent 70%),
 radial-gradient(600px 340px at -5% 110%,rgba(35,94,232,.12),transparent 70%),#fff;position:relative;padding:72px 80px}
body::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#dbe4ec 1px,transparent 1px),linear-gradient(90deg,#dbe4ec 1px,transparent 1px);background-size:44px 44px;opacity:.45;-webkit-mask-image:radial-gradient(ellipse 75% 85% at 70% 40%,#000 20%,transparent 75%)}
.top{position:relative;display:flex;align-items:center;gap:16px;font-size:34px;font-weight:700;letter-spacing:-1px}
.top img{width:60px;height:60px}.top span{font-weight:450;color:#53657a}
h1{position:relative;margin-top:62px;font-size:66px;line-height:1.08;letter-spacing:-2.4px;max-width:900px}
h1 em{font-style:normal;background:linear-gradient(100deg,#235ee8,#3b3fc4);-webkit-background-clip:text;color:transparent}
.apps{position:relative;display:flex;gap:14px;margin-top:52px}
.apps div{display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;font-size:22px;font-weight:650;background:var(--s);color:var(--c)}
.apps i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.url{position:absolute;right:80px;bottom:64px;font-size:22px;font-weight:600;color:#53657a}
</style></head><body>
<div class="top"><img src="mark.svg" alt=""><b>AI Sarthi <span>Tech</span></b></div>
<h1>AI that guides you from<br><em>job search to client meetings.</em></h1>
<div class="apps">
 <div style="--c:#06725d;--s:#eaf7f1"><i></i>Apply Sarthi</div>
 <div style="--c:#245adc;--s:#edf2ff"><i></i>Prep Sarthi</div>
 <div style="--c:#7251bf;--s:#f2edfc"><i></i>Live Sarthi</div>
 <div style="--c:#167c72;--s:#e9f5f2"><i></i>Meeting Sarthi</div>
</div>
<div class="url">aisarthitech.com</div>
</body></html>
